server:
  port: 3000

cms:
  mesh:
    jcr:
      user: "admin"
      password: "admin"
    cmis:
      user: "admin"
      password: "admin"
      url: "http://localhost:8080/alfresco/api/-default-/public/cmis/versions/1.1/atom"
      binding-type: "atompub"
      repository-id: "default"
    default-provider: LOCAL_JCR
    cache:
      enabled: true
      max-size: 100000
      expire-after-write-minutes: 30

    batch:
      enabled: true
      chunk-size: 10
      grid-size: 4
      thread-pool-size: 8
      skip-limit: 3
      retry-interval-ms: 1000
      default-protocol: LOCAL_JCR
      target-paths:
        - "/content/home"
        - "/content/products"
        - "/content/about"
        - "/content/pricing"